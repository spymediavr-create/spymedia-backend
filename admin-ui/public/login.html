<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인 · SpyMedia</title><link rel="stylesheet" href="/admin-assets/styles.css"><script src="/admin-assets/login.js" type="module"></script></head>
<body class="login-page">
  <header class="site-header"><a href="/admin/login" class="brand"><span class="brand-mark">S</span><strong>SpyMedia</strong><span class="brand-divider"></span><span>SNS 자동페이지</span></a><span class="header-status"><i></i> 로컬 UI</span></header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <div class="lock-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="7" y="14" width="18" height="14" rx="3"/><path d="M11 14V9a5 5 0 0 1 10 0v5M16 19v4"/></svg></div>
      <h2 id="login-title">관리자 로그인</h2><p class="muted">로그인 후 관리 화면을 이용하세요.</p>
      <form id="login-form">
        <label for="login-id">아이디</label><input id="login-id" name="username" type="text" autocomplete="username" placeholder="관리자 아이디" maxlength="120" required>
        <label for="login-password">비밀번호</label><div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" maxlength="256" required><button type="button" id="toggle-password" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div>
        <button id="login-submit" class="primary-button" type="submit" disabled>로그인</button>
        <p id="login-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      </form>
      <div class="preview-entry" id="preview-entry" hidden><p>관리자 인증은 아직 연결되지 않았습니다.</p><a class="secondary-button" href="/admin/preview">화면 미리보기</a><span>파일과 입력 내용은 현재 브라우저에서만 사용합니다.</span></div>
    </section>
  </main>
  <footer class="login-footer">SpyMedia · SNS 콘텐츠 워크스페이스</footer>
</body></html>
